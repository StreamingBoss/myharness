<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>myharness</title>
<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #1e1e1e;
    color: #ddd;
  }
  #settings-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    border-bottom: 1px solid #444;
    background: #252525;
    font-size: 13px;
    color: #bbb;
  }
  #settings-bar select, #settings-bar input {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: #ddd;
    font-size: 13px;
  }
  #settings-bar input {
    flex: 1;
    max-width: 600px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  #settings-bar .setting { display: flex; align-items: center; gap: 10px; }
  #settings-bar .setting:has(#project) { flex: 1; max-width: 700px; }
  #settings-bar .setting + .setting, #lock-note + .setting { margin-left: 20px; }
  .help, .pane-header[title] { text-decoration: underline dotted #666; cursor: help; }
  #settings-bar button {
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    background: #555;
    color: white;
    cursor: pointer;
  }
  #session-bar { display: flex; align-items: center; gap: 7px; padding: 6px 16px; background: #1a1a1a; border-bottom: 1px solid #444; font-size: 12px; }
  #session-bar select, #session-bar input, #session-bar button { padding: 5px 7px; border-radius: 5px; border: 1px solid #555; background: #303030; color: #ddd; }
  #session-status { color: #8acb88; min-width: 52px; }
  #settings-bar :disabled { opacity: 0.5; cursor: default; }
  #project-error { color: #ff6b6b; }
  #lock-note { color: #e0b050; cursor: help; }
  #lock-note[hidden] { display: none; }
  #browser {
    position: fixed;
    top: 46px;
    left: 160px;
    width: 560px;
    max-height: 60vh;
    display: flex;
    flex-direction: column;
    background: #252525;
    border: 1px solid #555;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    z-index: 10;
    font-size: 13px;
  }
  #browser[hidden] { display: none; }
  #browser-path {
    padding: 10px 14px;
    border-bottom: 1px solid #444;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    color: #ddd;
    word-break: break-all;
  }
  #browser-list { overflow-y: auto; padding: 4px 0; }
  #browser-list div {
    padding: 5px 14px;
    cursor: pointer;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  #browser-list div:hover { background: #2b5797; color: white; }
  #browser-list .empty { color: #888; cursor: default; }
  #browser-list .empty:hover { background: none; color: #888; }
  #browser-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid #444;
  }
  #browser-buttons button {
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    background: #555;
    color: white;
    cursor: pointer;
  }
  #browser-buttons #browser-select { background: #2b5797; }
  #panes {
    flex: 1;
    min-height: 0;
    display: flex;
  }
  #chat-pane, #internals-pane {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #chat-pane {
    flex: 0 0 50%;
    min-width: 0;
  }
  #splitter {
    flex: 0 0 6px;
    cursor: col-resize;
    background: #333;
    touch-action: none;
  }
  #vsplitter {
    flex: 0 0 6px;
    cursor: row-resize;
    background: #333;
    touch-action: none;
  }
  #splitter:hover, #splitter.dragging,
  #vsplitter:hover, #vsplitter.dragging { background: #2b5797; }
  #internals-pane {
    flex: 1;
    background: #141414;
  }
  .pane-header {
    padding: 10px 16px;
    border-bottom: 1px solid #444;
    font-size: 13px;
    color: #999;
    flex-shrink: 0;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .msg {
    max-width: 80%;
    margin-bottom: 12px;
    padding: 8px 12px;
    border-radius: 10px;
    white-space: pre-wrap;
    line-height: 1.4;
  }
  .msg.user {
    margin-left: auto;
    background: #2b5797;
    color: white;
  }
  .msg.assistant {
    margin-right: auto;
    background: #2a2a2a;
  }
  .msg.markdown { white-space: normal; }
  .msg.markdown > :first-child { margin-top: 0; }
  .msg.markdown > :last-child { margin-bottom: 0; }
  .msg.markdown p, .msg.markdown ul, .msg.markdown ol { margin: 0.5em 0; }
  .msg.markdown code {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.9em;
    background: #1b1b1b;
    padding: 1px 4px;
    border-radius: 4px;
  }
  .msg.markdown pre {
    background: #1b1b1b;
    padding: 10px;
    border-radius: 6px;
    overflow-x: auto;
  }
  .msg.markdown pre code { padding: 0; background: none; }
  .msg.markdown a { color: #5cb3ff; }
  .change {
    margin: 12px 0;
    border: 1px solid #555;
    border-radius: 8px;
    overflow: hidden;
    font-size: 13px;
  }
  .change-title {
    padding: 8px 12px;
    background: #2a2a2a;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  .change pre {
    margin: 0;
    padding: 8px 12px;
    max-height: 300px;
    overflow: auto;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 12px;
    background: #181818;
  }
  .change-note {
    margin-top: 4px;
    color: #e0b050;
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 12px;
  }
  .change pre.command-output { border-top: 1px solid #333; color: #bbb; }
  .diff-add { color: #6fcf6f; }
  .diff-del { color: #ff6b6b; }
  .diff-hunk { color: #888; }
  .change-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #2a2a2a;
  }
  .change-actions button {
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    background: #555;
  }
  .change-actions .approve { background: #2e7d32; }
  .change-status.approved { color: #6fcf6f; }
  .change-status.refused { color: #ff6b6b; }
  .msg.thinking {
    margin-right: auto;
    border-left: 3px solid #555;
    border-radius: 0;
    color: #8a8a8a;
    font-size: 13px;
    font-style: italic;
  }
  #messages.hide-thinking .msg.thinking { display: none; }
  .msg.thinking::before {
    content: "Thinking";
    display: block;
    font-style: normal;
    font-weight: bold;
    color: #777;
    margin-bottom: 4px;
  }
  #input-row {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    row-gap: 8px;
    border-top: 1px solid #444;
    padding: 10px;
  }
  #input-row #input {
    flex: 1;
    min-width: 180px;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: #ddd;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.4;
    resize: none;
    max-height: 9em;
    overflow-y: auto;
  }
  .toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: 10px;
    font-size: 13px;
    color: #bbb;
    white-space: nowrap;
    cursor: pointer;
  }
  #tools-row {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    row-gap: 6px;
    padding: 0 10px 10px 0;
  }
  .toggle.tool { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; }
  .toggle:has(input:disabled) { opacity: 0.5; cursor: default; }
  #input-row button {
    margin-left: 8px;
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    background: #2b5797;
    color: white;
    cursor: pointer;
  }
  #input-row button:disabled { opacity: 0.5; cursor: default; }
  #input-row #reset, #input-row #clear { background: #555; }
  #input-row #stop { background: #c62828; }
  #input-row button[hidden] { display: none; }
  .reset-divider {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin: 12px 0;
  }

  #terminal .sent { color: #f0a050; }
  #terminal .received { color: #6fcf6f; }
  #terminal .sent b { color: #ff5c5c; }
  #terminal .received b { color: #5cb3ff; }
  #harness-box {
    height: 25vh;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: #101820;
  }
  #context-meter { margin-left: auto; font-size: 12px; font-weight: normal; }
  #context-bar { width: 90px; height: 7px; accent-color: #80d890; margin-left: 8px; }
  #context-meter.amber { color: #e0b050; }
  #context-meter.red { color: #f08080; }
  #context-meter.amber #context-bar { accent-color: #e0b050; }
  #context-meter.red #context-bar { accent-color: #f08080; }
  #chat-pane > .pane-header { display: flex; align-items: center; gap: 8px; }
  #explore-header { display: flex; align-items: center; gap: 10px; }
  #explore-header select {
    padding: 3px 6px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: #ddd;
    font-size: 13px;
  }
  #explore-note { color: #8a8a8a; font-size: 12px; }
  #explore[hidden], #memory[hidden] { display: none; }
  #explore .token { color: #e0b050; font-weight: bold; }
  #explore .skill-loaded { color: #80d890; }
  #terminal, #memory, #explore {
    flex: 1;
    overflow-y: auto;
    margin: 0;
    padding: 16px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>

<div id="session-bar" title="Sessions are saved locally after each event. They retain the transcript, model memory, selected tools, approval choice and frozen prompt, agent and skills. Export contains the session but never project files. Display preferences stay in this browser.">
  <label for="session-select">Session:</label><select id="session-select"></select><button id="load-session">Load session</button>
  <button id="new-session">New session</button><button id="rename-session">Rename</button>
  <button id="export-session">Export</button>
  <label for="import-session">Import</label><input id="import-session" type="file" accept="application/json,.json" hidden>
  <span id="session-status">saved</span>
</div>

<div id="settings-bar">
  <span class="setting" title="The product's base instructions, sent as the system message: the very first message of every request (look at the start of each SENT block). These are community-collected prompt examples attributed to Cursor, Codex, Claude and others; their authenticity and currentness are not verified. The ~tokens number is what the prompt costs on EVERY request, before you type anything. It is chosen once per conversation and locks after your first message, because changing it mid-conversation confuses the model and throws away Ollama's cache.">
    <label for="prompt" class="help">System prompt:</label>
    <select id="prompt"></select>
  </span>
  <span class="setting" title="A persona: your own instructions, added after the system prompt in the same system message. Choosing an agent also ticks the tools it needs. Agents are Markdown files in agents/ (in myharness, or in the project folder for project-specific ones). Like the system prompt, it locks after your first message.">
    <label for="agent" class="help">Agent:</label>
    <select id="agent"></select>
  </span>
  <span id="lock-note" hidden title="Chosen at the start of the conversation. Unlocks with Clear conversation or Reset memory.">locked</span>
  <span class="setting" title="The folder the file tools work in. File tools cannot read or write outside it: the harness checks every path. Shell commands can access anything your user account can. Remembered when the harness restarts.">
    <label for="project" class="help">Project folder:</label>
    <input id="project" type="text" spellcheck="false">
  </span>
  <button id="browse" title="Pick the project folder by browsing the folders on this machine.">Browse…</button>
  <button id="set-project" title="Use the path typed in the field as the project folder.">Set</button>
  <span id="project-error"></span>
</div>

<div id="browser" hidden>
  <div id="browser-path"></div>
  <div id="browser-list"></div>
  <div id="browser-buttons">
    <button id="browser-cancel">Cancel</button>
    <button id="browser-select">Select this folder</button>
  </div>
</div>

<div id="panes">
<div id="chat-pane">
  <div class="pane-header" title="What a chat app shows you: your messages and the model's answers. Everything else the harness does is hidden here, and shown on the right and at the bottom.">Chat — <span id="model-name"></span><span id="context-meter" title="Input tokens from the last Ollama response (prompt_eval_count), not an estimate. Amber at 75%: old tool outputs are trimmed. Red at 90%: older messages are summarized. Ollama can silently drop the START of an overflowing prompt, including the system message. Until the next response, this shows the last measured request.">context: — / —<progress id="context-bar" max="100" value="0"></progress></span></div>
  <div id="messages"></div>
  <div id="input-row">
    <textarea id="input" rows="1" placeholder="Type a message... (Enter to send, Ctrl+Enter for a new line, /skill-name to use a skill)" autofocus></textarea>
    <label class="toggle" title="The model remembers nothing between requests. Checked: the harness keeps the conversation (the messages list at the bottom) and re-sends ALL of it with every request, which is why the 'in' token count grows each turn. Unchecked: only your new message is sent and nothing is kept, so the model can't refer to earlier messages."><input id="use-memory" type="checkbox" checked> <span class="help">Harness memory</span></label>
    <label class="toggle" title="Only changes what the chat shows: the model still thinks before answering (which takes time and output tokens), and the RECEIVED blocks on the right still contain its thinking. Applies to the thinking already in the chat too."><input id="hide-thinking" type="checkbox"> <span class="help">Hide thinking</span></label>
    <button id="reset" title="Empty the harness memory: the model forgets the conversation, but the chat stays visible. Also unlocks the system prompt and agent.">Reset memory</button>
    <button id="compact" title="Ask the model to summarize older messages (under 300 words), retaining at least the last 4 messages and complete tool-call batches. Costs a model request; the request and summary appear in Internals. Memory changes only if the summary succeeds and saves space.">Compact</button>
    <button id="clear" title="Start over: empty the memory and all three panels, and unlock the system prompt and agent.">Clear conversation</button>
    <button id="send">Send</button>
    <button id="stop" hidden title="Stop the current turn. The harness stops reading from Ollama and closes the connection, which makes Ollama stop generating; tools that haven't run yet are skipped, and a change waiting for approval is refused. During compaction, the summary request finishes but its result is discarded. What the model already wrote stays in memory, and every tool call it made gets a 'stopped' result so the next request stays consistent.">Stop</button>
  </div>
  <div id="tools-row">
    <label class="toggle" title="Tools let the model ask the harness to run a function (read a file, get the time...). The model never runs anything itself: it replies with a tool call, the harness runs it and sends the result back in a new request. Unchecked: no tools are described to the model, so it doesn't know they exist."><input id="use-tools" type="checkbox" checked> <span class="help">Tools:</span></label>
    <span id="tool-list"></span>
    <label class="toggle" title="Checked: before write_file or edit_file changes a file, the chat shows the diff (red removed, green added); before run_command runs, it shows the command. The harness then waits for your Approve or Deny. Deny is sent back to the model as the tool's result, so it can adjust. Unchecked: changes are written and commands run immediately. Careful: the project-folder limit only applies to the file tools; a shell command can do anything your user account can (cd .., rm...), so approval is the real protection."><input id="ask-approval" type="checkbox" checked> <span class="help">Ask before changes and commands</span></label>
  </div>
</div>

<div id="splitter" title="Drag to resize the chat and Internals panes"></div>

<div id="internals-pane">
  <div class="pane-header" title="Everything exchanged with Ollama. SENT (orange): the full request, rebuilt every time; your new message is in red. RECEIVED (green): the model's response with its statistics; the model's message is in blue. TOKENS: input + output tokens out of the context window. TOOL and FILE CHANGE: what the harness ran for the model.">Internals</div>
  <pre id="terminal">----------------------------------------
MODEL
----------------------------------------
Model: loading…

</pre>
</div>
</div>

<div id="vsplitter" title="Drag to give the memory box more or less space"></div>

<div id="harness-box">
  <div class="pane-header" id="explore-header">
    <label for="explore-view" class="help" title="Explore each piece that goes into a request: what the harness keeps and adds, what comes with the model, and the final text the model reads.">Explore:</label>
    <select id="explore-view">
      <option value="memory">harness memory</option>
      <option value="system">harness system prompt</option>
      <option value="agent">harness agent</option>
      <option value="project">harness project file</option>
      <option value="tools">harness tools</option>
      <option value="skills">harness skills</option>
      <option value="template">model template</option>
      <option value="final">prompt reconstruction (Qwen)</option>
    </select>
    <span id="explore-note"></span>
  </div>
  <pre id="memory"></pre>
  <pre id="explore" hidden></pre>
</div>

<script>
const messagesEl = document.getElementById("messages");
const terminalEl = document.getElementById("terminal");
const memoryEl = document.getElementById("memory");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const stopBtn = document.getElementById("stop");
const compactBtn = document.getElementById("compact");
const contextMeter = document.getElementById("context-meter");
const resetBtn = document.getElementById("reset");
const memoryCheckbox = document.getElementById("use-memory");
const toolsCheckbox = document.getElementById("use-tools");
const askApprovalCheckbox = document.getElementById("ask-approval");
const clearBtn = document.getElementById("clear");
const agentSelect = document.getElementById("agent");
const promptSelect = document.getElementById("prompt");
const lockNote = document.getElementById("lock-note");
const projectInput = document.getElementById("project");
const setProjectBtn = document.getElementById("set-project");
const projectError = document.getElementById("project-error");
let initialTerminal = terminalEl.textContent;
const API_BASE = window.MYHARNESS_API_BASE || new URLSearchParams(location.search).get("api") || "";
const api = (path) => API_BASE + path;
let session = {};
let sessionEvents = [];
let toolCheckboxes = [];
let contextLength = 0;
let initialized = false;
const sessionSelect = document.getElementById("session-select");
const sessionStatus = document.getElementById("session-status");

function markSessionSaving() { sessionStatus.textContent = "saving…"; }
async function saveSessionSettings() {
  if (!session.id) return;
  markSessionSaving();
  const settings = {use_memory: memoryCheckbox.checked, tools: currentTools(),
    ask_approval: askApprovalCheckbox.checked};
  try {
    const response = await fetch(api("/sessions/" + session.id), {method: "PATCH", headers: {"Content-Type":"application/json"}, body: JSON.stringify({settings})});
    if (!response.ok) throw new Error((await response.json()).error);
    session = await response.json(); sessionStatus.textContent = "saved";
  } catch (error) { sessionStatus.textContent = "save failed"; }
}

function fillSessionSelect(items, selected) {
  sessionSelect.replaceChildren();
  for (const item of items) {
    const date = new Date(item.created_at).toLocaleString();
    sessionSelect.add(new Option(item.name + " — " + date + " — " + item.workspace, item.id));
  }
  sessionSelect.value = selected;
}
function updateContextMeter(used, windowSize = contextLength) {
  const usage = windowSize ? 100 * used / windowSize : 0;
  const percent = Math.round(usage);
  contextMeter.className = used == null ? "" : (usage >= 90 ? "red" : usage >= 75 ? "amber" : "");
  contextMeter.firstChild.textContent = "context: " + (used == null ? "—" : used.toLocaleString("en")) +
    " / " + windowSize.toLocaleString("en") + (used == null ? "" : " (" + percent + "%)");
  document.getElementById("context-bar").value = used == null ? 0 : Math.min(100, percent);
}

function handleContextEvent(event) {
  if (event.action === "compact_request") {
    printBlock("SENT to Ollama — compaction", JSON.stringify(event.payload, null, 2), "sent");
  } else if (event.action === "compact_response") {
    printBlock("RECEIVED from Ollama — compaction", JSON.stringify(event.response, null, 2), "received");
  } else {
    addDivider(event.reason);
    printBlock("CONTEXT — " + event.action, event.reason + (event.summary ? "\n\n" + event.summary : ""));
    if (event.summary) renderChatBubble("assistant", "[Summary of earlier conversation]\n" + event.summary);
  }
  if (event.memory !== undefined) memoryEl.textContent = event.memory;
  if (event.skill_context) activeSkillContext = event.skill_context;
}

compactBtn.addEventListener("click", async () => {
  setControlsDisabled(true);
  try {
    const response = await fetch(api("/compact"), {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({use_memory: memoryCheckbox.checked, session_id: session.id}),
    });
    if (!response.ok) throw new Error((await response.json()).error);
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const {value, done} = await reader.read();
      buffer += done ? decoder.decode() : decoder.decode(value, {stream: true});
      let newline;
      while ((newline = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, newline);
        buffer = buffer.slice(newline + 1);
        if (line) handleContextEvent(JSON.parse(line));
      }
      if (done) break;
    }
  } catch (error) {
    handleContextEvent({action: "error", reason: "Compaction failed: " + error.message});
  } finally {
    setControlsDisabled(false);
    activeSkillContext = null;
    refreshExplorer();
  }
});

function renderChatBubble(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

const SEP = "-".repeat(40);

// body is a string, or [before, bold, after] to make the middle part bold
function printBlock(title, body, className = "") {
  const span = document.createElement("span");
  span.className = className;
  const [before, bold, after] = Array.isArray(body) ? body : [body, "", ""];
  span.append(SEP + "\n" + title + "\n" + SEP + "\n" + before);
  if (bold) {
    const b = document.createElement("b");
    b.textContent = bold;
    span.append(b);
  }
  span.append(after + "\n\n");
  terminalEl.appendChild(span);
  terminalEl.scrollTop = terminalEl.scrollHeight;
}

function replaySessionEvent(event) {
  // Replay is display-only: it never calls the model, tools, approvals, or project endpoints.
  if (event.type === "chat_user") renderChatBubble("user", event.content || "");
  else if (event.type === "request") printBlock("SENT to Ollama (saved)", event.parts, "sent");
  else if (event.type === "response") {
    printBlock("RECEIVED from Ollama (saved)", event.parts, "received");
    if (event.tokens) printBlock("TOKENS", event.tokens);
    if (event.tokens_in !== undefined) updateContextMeter(event.tokens_in, event.context_length);
  } else if (event.type === "thinking") renderChatBubble("thinking", event.content || "");
  else if (event.type === "chunk") { if (event.content) renderChatBubble("assistant", event.content); }
  else if (event.type === "tool") {
    printBlock("TOOL — the harness ran " + event.name, "arguments: " + event.arguments + "\nresult:    " + event.result);
    addDivider("used tool " + event.name);
  } else if (event.type === "command") {
    printBlock("COMMAND — " + (event.approved ? event.status : "refused"), "$ " + event.command + (event.approved ? "\n\n" + event.output : ""));
  } else if (event.type === "change") {
    printBlock("FILE CHANGE — " + event.path + (event.approved ? " (written)" : " (refused)"), (event.note ? "note: " + event.note + "\n\n" : "") + event.diff);
  } else if (event.type === "context") handleContextEvent(event);
  else if (event.type === "project_instructions") addDivider("— project instructions refreshed" + (event.changed ? " (changed)" : "") + " —");
  else if (event.type === "reset") addDivider("— memory reset —");
  else if (event.type === "stopped") { printBlock("STOPPED", event.reason); addDivider(event.reason); }
}

function replaySession() {
  messagesEl.replaceChildren();
  terminalEl.textContent = initialTerminal;
  let assistant = null, assistantText = "", thinking = null, thinkingText = "";
  for (const event of sessionEvents) {
    if (event.type === "chunk") {
      if (!assistant) assistant = renderChatBubble("assistant", "");
      assistantText += event.content || "";
      renderMarkdown(assistant, assistantText);
      continue;
    }
    if (event.type === "thinking") {
      if (!thinking) thinking = renderChatBubble("thinking", "");
      thinkingText += event.content || ""; thinking.textContent = thinkingText;
      continue;
    }
    if (event.type === "response") [assistant, assistantText] = completeReply(event, assistant, assistantText);
    replaySessionEvent(event);
    if (["tool", "chat_user", "stopped", "context"].includes(event.type)) {
      assistant = null; assistantText = ""; thinking = null; thinkingText = "";
    }
  }
}

function completeReply(event, bubble, text) {
  if (typeof event.content === "string" && event.content !== "" && event.content !== text) {
    if (!bubble) bubble = renderChatBubble("assistant", "");
    text = event.content;
    renderMarkdown(bubble, text);
  }
  return [bubble, text];
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  fitInput();
  // with memory on, this message starts (or continues) a conversation: lock its setup
  if (memoryCheckbox.checked) conversationLocked = true;
  setControlsDisabled(true);

  renderChatBubble("user", text);

  try {
    const resp = await fetch(api("/chat"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session_id: session.id,
        message: text,
        use_memory: memoryCheckbox.checked,
        ask_approval: askApprovalCheckbox.checked,
        agent: agentSelect.value,
        prompt: promptSelect.value,
        tools: toolsCheckbox.checked
          ? toolCheckboxes.filter((c) => c.checked).map((c) => c.value)
          : [],
      }),
    });

    if (!resp.ok) throw new Error((await resp.json()).error);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let assistantDiv = null;  // created on the first text chunk, after any tool notes
    let replyText = "";
    let thinkingDiv = null;
    let thinkingText = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let newlineIndex;
      while ((newlineIndex = buffer.indexOf("\n")) !== -1) {
        const line = buffer.slice(0, newlineIndex);
        buffer = buffer.slice(newlineIndex + 1);
        if (!line) continue;

        const event = JSON.parse(line);
        if (event.skill_context) {
          activeSkillContext = event.skill_context;
          if (exploreView.value === "skills" && skillsExplorerData) {
            renderSkills(skillsExplorerData, activeSkillContext);
          }
        }

        if (event.type === "context") {
          handleContextEvent(event);
        } else if (event.type === "request") {
          printBlock("SENT to Ollama (POST /api/chat)", event.parts, "sent");
          memoryEl.textContent = event.memory;
        } else if (event.type === "skill") {
          addDivider("— skill loaded: " + event.name + " —");
        } else if (event.type === "thinking") {
          if (!thinkingDiv) thinkingDiv = renderChatBubble("thinking", "");
          thinkingText += event.content;
          thinkingDiv.textContent = thinkingText;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } else if (event.type === "chunk") {
          if (!event.content) continue;
          if (!assistantDiv) assistantDiv = renderChatBubble("assistant", "");
          replyText += event.content;
          renderMarkdown(assistantDiv, replyText);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } else if (event.type === "response") {
          [assistantDiv, replyText] = completeReply(event, assistantDiv, replyText);
          updateContextMeter(event.tokens_in, event.context_length);
          printBlock("RECEIVED from Ollama", event.parts, "received");
          printBlock("TOKENS", event.tokens);
          memoryEl.textContent = event.memory;
        } else if (event.type === "tool") {
          printBlock("TOOL — the harness ran " + event.name,
                     "arguments: " + event.arguments + "\nresult:    " + event.result);
          memoryEl.textContent = event.memory;
          addDivider("used tool " + event.name);
          // text after a tool run goes in new bubbles, below the tool note
          assistantDiv = null;
          replyText = "";
          thinkingDiv = null;
          thinkingText = "";
        } else if (event.type === "approval") {
          changeBox = event.command !== undefined
            ? renderChangeBox("run_command wants to run, in " + projectInput.value + ":",
                              "$ " + event.command)
            : renderChangeBox(event.name + " wants to change " + event.path, event.diff,
                              event.note);
          addApprovalButtons(changeBox, event.id);
        } else if (event.type === "command") {
          if (!changeBox) changeBox = renderChangeBox("run_command ran:", "$ " + event.command);
          if (event.approved) {
            const out = document.createElement("pre");
            out.className = "command-output";
            out.textContent = event.output || "(no output)";
            changeBox.querySelector(".change-actions").before(out);
          }
          setChangeStatus(changeBox, event.approved, event.status);
          changeBox = null;
          printBlock("COMMAND — " + (event.approved ? event.status : "refused"),
                     "$ " + event.command + (event.approved ? "\n\n" + event.output : ""));
        } else if (event.type === "change") {
          if (!changeBox) changeBox = renderChangeBox(event.path, event.diff, event.note);
          setChangeStatus(changeBox, event.approved, "written");
          changeBox = null;
          printBlock("FILE CHANGE — " + event.path + (event.approved ? " (written)" : " (refused)"),
                     (event.note ? "note: " + event.note + "\n\n" : "") + event.diff);
        } else if (event.type === "stopped") {
          printBlock("STOPPED", event.reason);
          addDivider(event.reason);
          if (event.memory) memoryEl.textContent = event.memory;
        }
      }
    }

  } catch (error) {
    printBlock("STOPPED", "Chat request failed: " + error.message);
    addDivider("Chat request failed: " + error.message);
  } finally {
    setControlsDisabled(false);
    activeSkillContext = null;
    refreshExplorer();
    input.focus();
  }
}

let changeBox = null;  // the diff box of the file change being handled

const chatPane = document.getElementById("chat-pane");
const harnessBox = document.getElementById("harness-box");

// both apply a size in % (clamped) and return what they applied
function setChatWidth(percent) {
  percent = Math.min(80, Math.max(20, percent));
  chatPane.style.flexBasis = percent + "%";
  return percent;
}

function setMemoryHeight(percent) {
  percent = Math.min(70, Math.max(8, percent));
  harnessBox.style.height = percent + "vh";
  return percent;
}

// a draggable divider; its position is remembered in this browser
function setupDivider(handle, storageKey, apply, percentFromPointer) {
  try {
    const saved = localStorage.getItem(storageKey);
    if (saved) apply(Number(saved));
  } catch {}
  let value = null;
  handle.addEventListener("pointerdown", (e) => {
    handle.setPointerCapture(e.pointerId);
    handle.classList.add("dragging");
  });
  handle.addEventListener("pointermove", (e) => {
    if (handle.hasPointerCapture(e.pointerId)) value = apply(percentFromPointer(e));
  });
  handle.addEventListener("pointerup", () => {
    handle.classList.remove("dragging");
    if (value === null) return;
    try { localStorage.setItem(storageKey, value); } catch {}
  });
}

setupDivider(document.getElementById("splitter"), "chatWidth", setChatWidth, (e) => {
  const panes = document.getElementById("panes").getBoundingClientRect();
  return 100 * (e.clientX - panes.left) / panes.width;
});
setupDivider(document.getElementById("vsplitter"), "memoryHeight", setMemoryHeight,
             (e) => 100 * (window.innerHeight - e.clientY) / window.innerHeight);

const exploreView = document.getElementById("explore-view");
const exploreEl = document.getElementById("explore");
const exploreNote = document.getElementById("explore-note");

const EXPLORE_NOTES = {
  memory: "The messages list the harness keeps: the model's only memory, re-sent with every request. Tool calls and results are stored too; the system message and the thinking are not.",
  system: "The library prompt chosen at the top. It's the first part of the system message, at the very start of every request.",
  agent: "The agent's instructions, added after the system prompt in the same system message. Its tools line presets the tool checkboxes.",
  project: "AGENTS.md from the project folder root, added after the agent and before the skills. Read again for every model call: edits and project-folder changes apply immediately, even while the agent and system prompt are locked. Only AGENTS.md is used.",
  tools: "The checked tools, exactly as the harness sends them: a separate 'tools' field of the request, next to 'messages'. The model's template then turns them into text inside the system part; see 'final prompt'.",
  skills: "Green = text present in the harness context: names/descriptions in the system message, instruction lines in retained messages or the active turn. Updates as skills load via use_skill, /name or read_file; clears when that text leaves memory. Ollama may truncate overflowing requests without reporting which text remains. Skills are skills/<name>/SKILL.md files, in myharness or in the project folder.",
  template: "Comes with the model, from Ollama (/api/show). The template is the program that turns the system message, the tools and the conversation into the single text the model reads. The parameters are the model's default settings.",
  final: "An illustrative Qwen prompt reconstruction for the next request, including project instructions, tools and conversation. This is generated locally, not captured from Ollama; a different model template or Ollama version may render different text. SENT shows the actual API payload. Highlighted: special tokens and structural tags.",
};

function currentTools() {
  return toolsCheckbox.checked ? toolCheckboxes.filter((c) => c.checked).map((c) => c.value) : [];
}

function showHighlighted(text) {
  // special tokens like <|im_start|> and structural tags in color; everything else as text
  exploreEl.replaceChildren();
  const pattern = /<\|[a-z_]+\|>|<\/?(?:tools|tool_call|tool_response|think)>|\/think/g;
  let last = 0;
  for (const match of text.matchAll(pattern)) {
    exploreEl.append(text.slice(last, match.index));
    const span = document.createElement("span");
    span.className = "token";
    span.textContent = match[0];
    exploreEl.append(span);
    last = match.index + match[0].length;
  }
  exploreEl.append(text.slice(last));
}

let activeSkillContext = null;
let skillsExplorerData = null;

function renderSkills(data, context) {
  exploreEl.replaceChildren();
  function append(text, loaded, title) {
    const span = document.createElement("span");
    span.textContent = text;
    if (loaded) span.className = "skill-loaded";
    if (title) span.title = title;
    exploreEl.append(span);
  }
  if (!data.skills.length) {
    exploreEl.textContent = "(no skills: add skills/<name>/SKILL.md files)";
    exploreNote.textContent = EXPLORE_NOTES.skills;
    return;
  }
  const listCost = Math.round(data.skills_section.length / 4);
  const fullCost = Math.round(data.skills.reduce((n, s) => n + s.body.length, 0) / 4);
  exploreNote.textContent = EXPLORE_NOTES.skills + "  (list ~" + listCost +
    " tokens on every request" + (data.skills_listed ? "" : ", use_skill is unchecked") +
    "; all full skills ~" + fullCost.toLocaleString("en") + " tokens)";
  append("SENT ON EVERY REQUEST (in the system message)\n\n");
  const firstEntry = data.skills_section.indexOf("\n- ");
  append(data.skills_section.slice(0, firstEntry),
    data.skills.some(s => context[s.name]?.listed));
  for (const s of data.skills) {
    append("\n- " + s.name + ": " + s.description, context[s.name]?.listed,
      "Green when this name and description are in the system message.");
  }
  append("\n\n\nLOADED ONLY WHEN USED\n");
  for (const s of data.skills) {
    const state = context[s.name] || {};
    append("\n" + "-".repeat(40) + "\n" + s.name + " (" + s.source + ")\n" +
      "-".repeat(40) + "\n", state.body_loaded,
      "Green when all of these instructions are present in the harness context.");
    const loadedLines = new Set(state.loaded_lines || []);
    s.body.split("\n").forEach((line, i) => {
      append(line + "\n", state.body_loaded || loadedLines.has(i),
        "Green when this instruction line is present in the harness context.");
    });
  }
}

async function refreshExplorer() {
  if (!initialized) return;
  const view = exploreView.value;
  const showMemory = view === "memory";
  memoryEl.hidden = !showMemory;
  exploreEl.hidden = showMemory;
  let note = EXPLORE_NOTES[view];
  if (showMemory) {
    exploreNote.textContent = note;
    return;
  }
  const resp = await fetch(api("/explore"), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      use_memory: memoryCheckbox.checked,
      agent: agentSelect.value,
      prompt: promptSelect.value,
      tools: currentTools(),
    }),
  });
  const data = await resp.json();
  if (exploreView.value !== view) return;  // the user switched views meanwhile
  let text;
  if (view === "system") {
    text = data.prompt_name ? data.system_prompt : "(no system prompt selected)";
  } else if (view === "agent") {
    text = data.agent
      ? "agent: " + data.agent_name + " (" + data.agent.source + ")\ntools: " +
        (data.agent.tools.join(", ") || "(none)") + "\n\n" + data.agent.prompt
      : "(no agent selected)";
  } else if (view === "project") {
    text = data.project_instructions
      ? data.project_instructions[0] + "\n\n" + data.project_instructions[1]
      : "none: create AGENTS.md in the project folder";
  } else if (view === "tools") {
    text = data.tools === "[]" ? "(no tools checked: the request has no 'tools' field)" : data.tools;
  } else if (view === "skills") {
    skillsExplorerData = data;
    renderSkills(data, activeSkillContext || data.skill_context);
    return;
  } else if (view === "template") {
    text = "TEMPLATE\n\n" + data.template + "\n\nPARAMETERS\n\n" + data.parameters;
  } else {
    text = data.final;
  }
  if (view !== "template" && view !== "skills") {
    note += "  (~" + Math.round(text.length / 4).toLocaleString("en") + " tokens)";
  }
  exploreNote.textContent = note;
  if (view === "final") showHighlighted(text);
  else exploreEl.textContent = text;
}

exploreView.addEventListener("change", refreshExplorer);
// deferred, so it runs after the other change handlers (choosing an agent ticks its tools)
for (const el of [promptSelect, agentSelect, toolsCheckbox, memoryCheckbox, ...toolCheckboxes]) {
  el.addEventListener("change", () => setTimeout(refreshExplorer));
}

function renderMarkdown(div, text) {
  div.classList.add("markdown");
  div.innerHTML = DOMPurify.sanitize(marked.parse(text));
}

function renderChangeBox(title, diff, note) {
  const box = document.createElement("div");
  box.className = "change";
  const titleEl = document.createElement("div");
  titleEl.className = "change-title";
  titleEl.textContent = title;
  if (note) {
    const noteEl = document.createElement("div");
    noteEl.className = "change-note";
    noteEl.textContent = "Note: " + note + ".";
    titleEl.appendChild(noteEl);
  }
  const pre = document.createElement("pre");
  for (const line of diff.split("\n")) {
    const span = document.createElement("span");
    if (line.startsWith("@@")) span.className = "diff-hunk";
    else if (line.startsWith("+") && !line.startsWith("+++")) span.className = "diff-add";
    else if (line.startsWith("-") && !line.startsWith("---")) span.className = "diff-del";
    span.textContent = line + "\n";
    pre.appendChild(span);
  }
  const actions = document.createElement("div");
  actions.className = "change-actions";
  box.append(titleEl, pre, actions);
  messagesEl.appendChild(box);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return box;
}

function addApprovalButtons(box, id) {
  const actions = box.querySelector(".change-actions");
  const deny = document.createElement("button");
  deny.textContent = "Deny";
  const approve = document.createElement("button");
  approve.textContent = "Approve";
  approve.className = "approve";
  for (const [button, approved] of [[deny, false], [approve, true]]) {
    button.addEventListener("click", () => {
      deny.disabled = approve.disabled = true;
      fetch(api("/approve"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, approved }),
      });
    });
  }
  actions.append(deny, approve);
}

function setChangeStatus(box, approved, doneLabel) {
  const actions = box.querySelector(".change-actions");
  const status = document.createElement("span");
  status.className = "change-status " + (approved ? "approved" : "refused");
  status.textContent = approved ? doneLabel : "refused";
  actions.replaceChildren(status);
}

function setControlsDisabled(disabled) {
  for (const el of [input, sendBtn, resetBtn, compactBtn, clearBtn, memoryCheckbox, toolsCheckbox,
                    askApprovalCheckbox, projectInput, setProjectBtn, browseBtn]) {
    el.disabled = disabled;
  }
  compactBtn.disabled = disabled || !memoryCheckbox.checked;
  for (const c of toolCheckboxes) c.disabled = disabled || !toolsCheckbox.checked;
  agentSelect.disabled = promptSelect.disabled = disabled || conversationLocked;
  lockNote.hidden = !conversationLocked;
  // while a turn runs, Stop takes the place of Send
  sendBtn.hidden = disabled;
  stopBtn.hidden = !disabled;
  stopBtn.disabled = false;
}

function unlockConversation() {
  conversationLocked = false;
  setControlsDisabled(false);
}

toolsCheckbox.addEventListener("change", () => {

let prompts = [];

let conversationLocked = false;

}
if (session.snapshots?.agent?.name && !agents.some(a => a.name === session.snapshots.agent.name)) {

function fillAgentSelect() {
  const previous = agentSelect.value;
  agentSelect.replaceChildren(new Option("none", ""));
  for (const a of agents) {
    agentSelect.add(new Option(a.name + " (" + a.source + ")", a.name));
  }
  if (previous && !agents.some((a) => a.name === previous)) {
    addDivider("— agent " + previous + " not in this project: agent set to none —");
  } else {
    agentSelect.value = previous;
  }
}

agentSelect.addEventListener("change", () => {
  const agent = agents.find((a) => a.name === agentSelect.value);
  if (agent) {
    toolsCheckbox.checked = agent.tools.length > 0;
    for (const c of toolCheckboxes) {
      c.checked = agent.tools.includes(c.value);
      c.disabled = !toolsCheckbox.checked;

  addDivider("— agent: " + agentSelect.selectedOptions[0].textContent + " —");
});

async function setProject() {
  const resp = await fetch(api("/project"), {

const browseBtn = document.getElementById("browse");

function browserEntry(label, onClick, className = "") {
  const div = document.createElement("div");
  div.textContent = label;
  div.className = className;
  if (onClick) div.addEventListener("click", onClick);
  browserList.appendChild(div);
}

async function browse(path) {
  const resp = await fetch(api("/browse?path=" + encodeURIComponent(path)));
  const result = await resp.json();
  if (!resp.ok) {
    projectError.textContent = result.error;
    return;
  }
  projectError.textContent = "";
  browsedPath = result.path;
  browserPath.textContent = result.path;
  browserList.replaceChildren();
  if (result.parent) browserEntry("..", () => browse(result.parent));
  for (const name of result.folders) {
    browserEntry(name + "/", () => browse(result.path.replace(/\/$/, "") + "/" + name));
  }
  if (!result.folders.length) browserEntry("(no sub-folders)", null, "empty");
  browserEl.hidden = false;
}

function renderTools(tools) {
  const list = document.getElementById("tool-list");
  list.replaceChildren();
  for (const tool of tools) {

    label.title = "What the model is told: \"" + tool.description + "\"\n\nWhile checked, this description is sent with every request, which costs input tokens.";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.className = "tool-checkbox";
    checkbox.value = tool.name;
    checkbox.checked = true;

function initialize(data) {
  contextLength = data.context_length;
  session = data.session || {};
  sessionEvents = session.events || [];
  agents = data.agents;
  prompts = data.prompts;
  locked = data.locked;
  projectInput.value = data.project;
  document.getElementById("model-name").textContent = data.model;
  initialTerminal = "----------------------------------------\nMODEL\n----------------------------------------\nModel: " + data.model + "  (context window: " + data.context_length + " tokens)\n\n";
  terminalEl.textContent = initialTerminal;
  memoryEl.textContent = data.memory;
  renderTools(data.tools);
  fillSessionSelect(data.sessions, session.id);
  promptSelect.replaceChildren(new Option("none", ""));
  for (const p of prompts) {
    const option = new Option(p.name + " (~" + p.tokens.toLocaleString("en") + " tokens)" + (p.fits ? "" : " — too big for the context window"), p.name);
    option.disabled = !p.fits;
    promptSelect.add(option);
  }
  if (session.snapshots?.prompt?.name && !prompts.some(p => p.name === session.snapshots.prompt.name)) promptSelect.add(new Option(session.snapshots.prompt.name + " (saved with this session)", session.snapshots.prompt.name));
  if (session.snapshots?.agent?.name && !agents.some(a => a.name === session.snapshots.agent.name)) agents.push({name: session.snapshots.agent.name, source: "saved session", tools: session.snapshots.agent.value?.tools || []});
  fillAgentSelect();
  if (locked) {
    promptSelect.value = locked.prompt;
    agentSelect.value = locked.agent;
    conversationLocked = true;
  }
  if (session.setup) {
    promptSelect.value = session.setup.prompt || "";
    agentSelect.value = session.setup.agent || "";
  }
  for (const checkbox of toolCheckboxes) checkbox.checked = (session.settings?.tools || toolCheckboxes.map(c => c.value)).includes(checkbox.value);
  toolsCheckbox.checked = toolCheckboxes.some(c => c.checked);
  askApprovalCheckbox.checked = session.settings?.ask_approval ?? true;
  memoryCheckbox.checked = session.settings?.use_memory ?? true;
  initialized = true;
  updateContextMeter(data.last_prompt_tokens || null);
  replaySession();
  setControlsDisabled(false);
  refreshExplorer();
}

fetch(api("/bootstrap")).then(response => response.ok ? response.json() : Promise.reject(new Error("Could not load backend state."))).then(initialize).catch(error => {
  terminalEl.textContent = initialTerminal + "\nBackend unavailable: " + error.message;
});

document.getElementById("hide-thinking").addEventListener("change", (e) => {
  messagesEl.classList.toggle("hide-thinking", e.target.checked);
  try { localStorage.setItem("hideThinking", e.target.checked ? "1" : ""); } catch {}
});

for (const el of [memoryCheckbox, toolsCheckbox, askApprovalCheckbox, ...toolCheckboxes]) {
  el.addEventListener("change", saveSessionSettings);
}
exploreView.addEventListener("change", () => {
  try { localStorage.setItem("exploreView", exploreView.value); } catch {}
});

async function loadSelectedSession() {
  if (!sessionSelect.value || sessionSelect.value === session.id) return;
  try {
    const response = await fetch(api("/sessions/" + sessionSelect.value + "/activate"), {method: "POST"});
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Could not load this session.");
    location.reload();
  } catch (error) {
    sessionStatus.textContent = error.message || "Could not load this session.";
    sessionSelect.value = session.id;
  }
}
document.getElementById("load-session").addEventListener("click", loadSelectedSession);
document.getElementById("new-session").addEventListener("click", async () => {
  const response = await fetch(api("/sessions"), {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
  if (!response.ok) { sessionStatus.textContent = (await response.json()).error; return; }
  location.reload();
});
document.getElementById("rename-session").addEventListener("click", async () => {
  const name = prompt("Session name:", session.name); if (!name || !name.trim()) return;
  const response = await fetch(api("/sessions/" + session.id), {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name})});
  if (!response.ok) { sessionStatus.textContent = "save failed"; return; }
  session = await response.json();
  const listing = await (await fetch(api("/sessions"))).json(); fillSessionSelect(listing.sessions, session.id);
});
document.getElementById("export-session").addEventListener("click", () => { location.href = api("/sessions/" + session.id + "/export"); });
document.getElementById("import-session").addEventListener("change", async (e) => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const response = await fetch(api("/sessions/import"), {method:"POST", headers:{"Content-Type":"application/json"}, body:await file.text()});
    const result = await response.json(); if (!response.ok) throw new Error(result.error);
    fillSessionSelect(result.sessions, session.id); sessionStatus.textContent = "imported";
  } catch (error) { sessionStatus.textContent = error.message; }
  e.target.value = "";
});

// Hydrate the session only after all renderer and control helpers exist.
if (session.settings) {
  memoryCheckbox.checked = session.settings.use_memory !== false;
  askApprovalCheckbox.checked = session.settings.ask_approval !== false;
  for (const checkbox of toolCheckboxes) checkbox.checked = (session.settings.tools || []).includes(checkbox.value);
  toolsCheckbox.checked = toolCheckboxes.some(c => c.checked);
  try {
    const hideThinking = localStorage.getItem("hideThinking") === "1";
    document.getElementById("hide-thinking").checked = hideThinking;
    messagesEl.classList.toggle("hide-thinking", hideThinking);
    exploreView.value = localStorage.getItem("exploreView") || "memory";
  } catch {}
  replaySession();
}

sendBtn.addEventListener("click", sendMessage);
stopBtn.addEventListener("click", () => {
  stopBtn.disabled = true;
  fetch(api("/stop"), { method: "POST" });
});
clearBtn.addEventListener("click", clearConversation);
resetBtn.addEventListener("click", () => resetMemory("— memory reset —"));
memoryCheckbox.addEventListener("change", () => {
  compactBtn.disabled = !memoryCheckbox.checked;
  if (memoryCheckbox.checked) addDivider("— harness memory on —");
  else resetMemory("— harness memory off: memory cleared —");
});
function fitInput() {
  input.style.height = "auto";
  input.style.height = input.scrollHeight + 2 + "px";
}

input.addEventListener("input", fitInput);
input.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  if (e.ctrlKey) {
    input.setRangeText("\n", input.selectionStart, input.selectionEnd, "end");
    fitInput();
  } else {
    sendMessage();
  }
});
</script>

</body>
</html>
